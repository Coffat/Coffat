<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" fill="none" role="img" aria-label="GitHub Overview and Top Languages">
  <defs>
    <linearGradient id="sc-light-accent-bar" x1="22" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#2DA44E"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes sc-light-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.6); }
    }
    @keyframes sc-light-grow {
      0% { transform: scaleX(0); opacity: 0.4; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes sc-light-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }
    .sc-light-live { transform-origin: 349px 26px; animation: sc-light-live 2.2s ease-in-out infinite; }
    .sc-light-accent { animation: sc-light-breathe 3.5s ease-in-out infinite; }
    .sc-light-b0{transform-origin:576px 56px;animation:sc-light-grow 1.1s cubic-bezier(0.22,1,0.36,1) 0.00s both,sc-light-breathe 4.2s ease-in-out 1.20s infinite;}.sc-light-b1{transform-origin:576px 81px;animation:sc-light-grow 1.1s cubic-bezier(0.22,1,0.36,1) 0.12s both,sc-light-breathe 4.2s ease-in-out 1.32s infinite;}.sc-light-b2{transform-origin:576px 106px;animation:sc-light-grow 1.1s cubic-bezier(0.22,1,0.36,1) 0.24s both,sc-light-breathe 4.2s ease-in-out 1.44s infinite;}.sc-light-b3{transform-origin:576px 131px;animation:sc-light-grow 1.1s cubic-bezier(0.22,1,0.36,1) 0.36s both,sc-light-breathe 4.2s ease-in-out 1.56s infinite;}.sc-light-b4{transform-origin:576px 156px;animation:sc-light-grow 1.1s cubic-bezier(0.22,1,0.36,1) 0.48s both,sc-light-breathe 4.2s ease-in-out 1.68s infinite;}
  </style>

  <!-- ================= LEFT CARD: GITHUB OVERVIEW (0..432) ================= -->
  <rect x="0.5" y="0.5" width="431" height="187" rx="14" fill="#FFFDF8" stroke="#E6DFD3" stroke-width="1"/>

  <!-- Card Header -->
  <text x="22" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F1D1A">GitHub Overview</text>
  <rect x="339" y="16" width="71" height="20" rx="10" fill="#F6EFE2" stroke="#E5D8C3" stroke-width="1"/>
  <circle class="sc-light-live" cx="349" cy="26" r="4" fill="#2DA44E" opacity="0.35"/>
  <circle cx="349" cy="26" r="2.6" fill="#2DA44E"/>
  <text x="357" y="29.5" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="9.5" font-weight="600" fill="#5C564E">LIVE · 1Y</text>

  <!-- 2x2 KPI Tiles -->
  <!-- Tile 1: Contributions -->
  <rect x="22" y="46" width="188" height="58" rx="10" fill="#F6F2EA" stroke="#E6DFD3" stroke-width="1"/>
  <g transform="translate(34, 63)" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="3"/>
    <line x1="1" y1="8" x2="5" y2="8"/>
    <line x1="11" y1="8" x2="15" y2="8"/>
  </g>
  <text x="58" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1D1A">682</text>
  <text x="58" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8A8277">Contributions (1Y)</text>

  <!-- Tile 2: Public Repos -->
  <rect x="222" y="46" width="188" height="58" rx="10" fill="#F6F2EA" stroke="#E6DFD3" stroke-width="1"/>
  <g transform="translate(234, 63)" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3.5A1.5 1.5 0 0 1 4.5 2H13v12H4.5A1.5 1.5 0 0 1 3 12.5v-9z"/>
    <line x1="3" y1="11.5" x2="13" y2="11.5"/>
  </g>
  <text x="258" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1D1A">35</text>
  <text x="258" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8A8277">Public Repos</text>

  <!-- Tile 3: Total Stars -->
  <rect x="22" y="114" width="188" height="58" rx="10" fill="#F6F2EA" stroke="#E6DFD3" stroke-width="1"/>
  <g transform="translate(34, 131)" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="8,1.5 10,5.6 14.5,6.2 11.2,9.4 12,14 8,11.8 4,14 4.8,9.4 1.5,6.2 6,5.6"/>
  </g>
  <text x="58" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1D1A">2</text>
  <text x="58" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8A8277">Total Stars</text>

  <!-- Tile 4: Longest Streak -->
  <rect x="222" y="114" width="188" height="58" rx="10" fill="#F6F2EA" stroke="#E6DFD3" stroke-width="1"/>
  <g transform="translate(234, 131)" stroke="#E11D48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 1.5C9.5 4.5 13 6 13 9.5a5 5 0 0 1-10 0c0-2 1.2-3.8 2.5-5 .2 1.5 1 2.2 1.8 2.2.2-1.8.4-3.7 1.2-5.2z"/>
  </g>
  <text x="258" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F1D1A">15d</text>
  <text x="258" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8A8277">Longest Streak · 100d active</text>

  <!-- Subtle bottom animated accent bar -->
  <rect x="22" y="179" width="388" height="2.5" rx="1.25" fill="#ECE5D9"/>
  <rect class="sc-light-accent" x="22" y="179" width="388" height="2.5" rx="1.25" fill="url(#sc-light-accent-bar)"/>

  <!-- ================= RIGHT CARD: TOP LANGUAGES (448..880) ================= -->
  <rect x="448.5" y="0.5" width="431" height="187" rx="14" fill="#FFFDF8" stroke="#E6DFD3" stroke-width="1"/>

  <!-- Card Header -->
  <text x="470" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1F1D1A">Top Languages</text>
  <text x="856" y="30" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#8A8277" text-anchor="end">filtered · top 5</text>

  <!-- 5 Language Rows -->
  <g>
    <circle cx="474" cy="56" r="4" fill="#3572A5"/>
    <text x="486" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1F1D1A">Python</text>
    <rect x="576" y="52" width="224" height="8" rx="4" fill="#ECE5D9"/>
    <rect class="sc-light-b0" x="576" y="52" width="122.5" height="8" rx="4" fill="#3572A5"/>
    <text x="856" y="60" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#5C564E" text-anchor="end">54.7%</text>
  </g>
  <g>
    <circle cx="474" cy="81" r="4" fill="#E08E45"/>
    <text x="486" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1F1D1A">Java</text>
    <rect x="576" y="77" width="224" height="8" rx="4" fill="#ECE5D9"/>
    <rect class="sc-light-b1" x="576" y="77" width="67.4" height="8" rx="4" fill="#E08E45"/>
    <text x="856" y="85" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#5C564E" text-anchor="end">30.1%</text>
  </g>
  <g>
    <circle cx="474" cy="106" r="4" fill="#3178C6"/>
    <text x="486" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1F1D1A">TypeScript</text>
    <rect x="576" y="102" width="224" height="8" rx="4" fill="#ECE5D9"/>
    <rect class="sc-light-b2" x="576" y="102" width="24.4" height="8" rx="4" fill="#3178C6"/>
    <text x="856" y="110" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#5C564E" text-anchor="end">10.9%</text>
  </g>
  <g>
    <circle cx="474" cy="131" r="4" fill="#A97BFF"/>
    <text x="486" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1F1D1A">Kotlin</text>
    <rect x="576" y="127" width="224" height="8" rx="4" fill="#ECE5D9"/>
    <rect class="sc-light-b3" x="576" y="127" width="9.0" height="8" rx="4" fill="#A97BFF"/>
    <text x="856" y="135" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#5C564E" text-anchor="end">4.0%</text>
  </g>
  <g>
    <circle cx="474" cy="156" r="4" fill="#F1E05A"/>
    <text x="486" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#1F1D1A">JavaScript</text>
    <rect x="576" y="152" width="224" height="8" rx="4" fill="#ECE5D9"/>
    <rect class="sc-light-b4" x="576" y="152" width="8.0" height="8" rx="4" fill="#F1E05A"/>
    <text x="856" y="160" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#5C564E" text-anchor="end">0.4%</text>
